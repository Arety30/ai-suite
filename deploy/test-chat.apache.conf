# Apache reverse proxy: HOST.duckdns.org (port 80) -> local chatbot (127.0.0.1:8100)
# Temporary, for testing the chatbot over the network. Remove when done.
<VirtualHost *:80>
    ServerName HOST.duckdns.org

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8100/
    ProxyPassReverse /  http://127.0.0.1:8100/

    ErrorLog  ${APACHE_LOG_DIR}/test-chat-error.log
    CustomLog ${APACHE_LOG_DIR}/test-chat-access.log combined
</VirtualHost>
